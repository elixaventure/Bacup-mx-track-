# Plain static site: no build step, publish the repo root.
[build]
  publish = "."

# Keep scripts and styles fresh so config changes show up quickly.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

# rider-app/ is a separate app with its own Netlify site; don't serve its source from this one.
[[redirects]]
  from = "/rider-app/*"
  to = "/404.html"
  status = 404
  force = true
